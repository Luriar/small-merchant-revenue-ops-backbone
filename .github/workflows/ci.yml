name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install Terraform CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common curl
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(. /etc/os-release && echo "$VERSION_CODENAME") main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y terraform
          terraform version
      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Backend route and collector tests
        run: |
          node --test apps/api/src/revenue-ops/context-collectors.test.js
          node --test apps/api/src/revenue-ops/revenue-ops-saas-routes.test.js
          node --test apps/api/src/revenue-ops/revenue-upload-parsers.test.js

      - name: Backend syntax check
        run: find apps/api/src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Lambda package manifest
        run: node scripts/validate_step3_lambda_package_manifest.js

      - name: Frontend typecheck
        run: npm --prefix apps/web run check

      - name: Frontend build
        run: npm --prefix apps/web run build

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        run: terraform -chdir=infra/terraform/envs/revenue-dev init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/envs/revenue-dev validate

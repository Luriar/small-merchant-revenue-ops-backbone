version: "0.1"
description: "소상공인 Revenue Ops 액션 카탈로그 — 매출 이상 탐지 후 추천되는 16개 액션 템플릿"

actions:
  rainy_day_takeout_coupon:
    action_type: promotion
    title: "우천 날 테이크아웃 쿠폰 발행"
    description: "강수일이 늘어난 기간에 테이크아웃 주문 유도를 위한 쿠폰 또는 할인 혜택을 제공합니다."
    why_this_action: "강수일 증가와 매출 하락이 함께 관측될 때, 방문 고객 감소를 테이크아웃/배달로 전환하면 매출 방어가 가능할 수 있습니다."
    expected_effect: "강수일 기간 테이크아웃 주문 비율 증가, 매출 하락 폭 완화 가능"
    risk_note: "쿠폰 단가 설정을 신중하게 해야 마진이 지나치게 줄지 않습니다."
    evidence_trigger:
      - revenue_drop
      - weather

  warm_menu_exposure:
    action_type: menu_update
    title: "계절성 따뜻한 메뉴 전면 배치"
    description: "기온이 낮아지거나 강수가 늘어난 시기에 따뜻한 음료·메뉴를 메뉴판 상단 및 SNS에 우선 노출합니다."
    why_this_action: "날씨 변화(기온 하락, 강수 증가)와 매출 하락이 함께 관측될 때, 계절 수요를 반영한 메뉴 구성 변경이 효과적일 수 있습니다."
    expected_effect: "계절 메뉴 주문 비율 증가, 객단가 유지 또는 개선 가능"
    risk_note: "재고 준비 및 원가 검토 후 진행 필요. 과잉 준비 시 폐기 손실 발생 가능."
    evidence_trigger:
      - revenue_drop
      - weather

  weekday_evening_set_menu:
    action_type: menu_update
    title: "평일 저녁 세트 메뉴 출시"
    description: "평일 저녁 시간대 수요를 높이기 위해 2인 세트 또는 저녁 한정 메뉴를 운영합니다."
    why_this_action: "유동인구 감소와 매출 하락이 함께 관측될 때, 평일 저녁 방문 유인을 높이면 객단가를 높이는 방향으로 매출을 방어할 수 있습니다."
    expected_effect: "평일 저녁 평균 객단가 증가, 방문 건수 유지 또는 증가 가능"
    risk_note: "저녁 시간대 인력 운영 비용을 함께 검토해야 합니다."
    evidence_trigger:
      - revenue_drop
      - demand

  regular_customer_reactivation:
    action_type: customer_retention
    title: "단골 고객 재방문 유도 캠페인"
    description: "쿠폰, 스탬프 프로그램, 또는 단골 혜택을 통해 기존 고객의 재방문을 유도합니다."
    why_this_action: "유동인구 감소 시기에는 신규 고객 유입보다 기존 고객의 재방문 빈도를 높이는 것이 비용 효율적입니다."
    expected_effect: "재방문율 증가, 월별 평균 방문 빈도 개선 가능"
    risk_note: "단골 혜택이 과도하면 마진에 영향을 줄 수 있습니다."
    evidence_trigger:
      - revenue_drop
      - demand

  representative_menu_repositioning:
    action_type: menu_update
    title: "대표 메뉴 재포지셔닝"
    description: "경쟁 증가 또는 전환율 저하 시, 대표 메뉴의 가격·구성·네이밍을 재검토하고 강점을 전면에 내세웁니다."
    why_this_action: "경쟁 점포 증가 또는 수요는 유지되나 매출이 하락할 때, 대표 메뉴의 경쟁력 개선이 전환율을 높일 수 있습니다."
    expected_effect: "대표 메뉴 주문 비율 증가, 경쟁 상품 대비 선택 우선순위 향상"
    risk_note: "가격 변경 시 기존 고객의 저항이 있을 수 있으므로 점진적 변경 권장."
    evidence_trigger:
      - revenue_drop
      - competition
      - benchmark_or_conversion

  bundle_instead_of_price_cut:
    action_type: promotion
    title: "가격 인하 대신 번들 구성"
    description: "단순 가격 할인 대신, 음료+디저트 등 번들 구성으로 체감 가치를 높입니다."
    why_this_action: "경쟁 심화 시 가격 할인은 마진을 직접 갉아먹습니다. 번들 구성은 동일한 할인 효과를 내면서 객단가를 유지할 수 있습니다."
    expected_effect: "객단가 유지 또는 증가, 원가율 조정 가능, 고객 만족도 유지"
    risk_note: "번들 구성품의 원가 합산이 판매가 이하가 되지 않도록 계산 필요."
    evidence_trigger:
      - revenue_drop
      - competition

  storefront_menu_copy_update:
    action_type: communication
    title: "매장 앞 메뉴판/홍보 문구 업데이트"
    description: "매장 입구 메뉴판, SNS 프로필, 플레이스 설명을 최신 메뉴와 강점 위주로 업데이트합니다."
    why_this_action: "수요는 존재하지만 매출이 낮을 때, 가시성과 클릭 전환율을 높이는 것이 효과적입니다."
    expected_effect: "신규 방문객 유입 증가, 네이버 플레이스/배달앱 노출 품질 개선"
    risk_note: "사진·문구 품질이 낮으면 역효과가 날 수 있습니다."
    evidence_trigger:
      - revenue_drop
      - benchmark_or_conversion
      - context

  local_event_takeout_menu:
    action_type: menu_update
    title: "지역 행사 시즌 테이크아웃 메뉴 구성"
    description: "상권 주변 지역 행사 기간에 맞춘 테이크아웃·간편 메뉴를 준비합니다."
    why_this_action: "지역 행사는 유동인구를 단기적으로 증가시킵니다. 행사 참가자를 위한 빠른 서비스와 테이크아웃 메뉴를 미리 준비하면 매출 기회를 잡을 수 있습니다."
    expected_effect: "행사 기간 테이크아웃 주문 증가, 행사 관련 단기 매출 기회 포착"
    risk_note: "행사 날짜를 사전에 확인하고 재료 준비를 미리 해야 합니다."
    evidence_trigger:
      - revenue_drop
      - context

  quick_order_menu_for_event_days:
    action_type: operational
    title: "행사일 빠른 주문 메뉴 운영"
    description: "지역 행사가 있는 날, 대기 시간을 줄이기 위한 간소화 메뉴와 빠른 주문 프로세스를 운영합니다."
    why_this_action: "행사 참가자는 이동 중이라 대기 시간이 길면 이탈합니다. 빠른 주문이 가능한 메뉴 운영이 전환율을 높입니다."
    expected_effect: "행사일 고객 이탈률 감소, 회전율 증가"
    risk_note: "간소화 메뉴가 기존 단골 고객 기대와 다를 수 있으므로 별도 안내 필요."
    evidence_trigger:
      - revenue_drop
      - context

  review_response_priority:
    action_type: communication
    title: "리뷰 응답 우선 관리"
    description: "네이버 플레이스, 카카오맵, 배달앱의 최근 리뷰에 성실히 응답하고, 부정 리뷰 원인을 파악합니다."
    why_this_action: "수요가 존재하지만 전환율이 낮을 때, 리뷰 품질과 응답율이 신규 고객 선택에 영향을 줍니다."
    expected_effect: "리뷰 플랫폼 신뢰도 개선, 신규 고객 전환율 증가"
    risk_note: "부정 리뷰에 방어적으로 응답하면 역효과가 납니다. 개선 의지를 보여주는 것이 중요합니다."
    evidence_trigger:
      - revenue_drop
      - benchmark_or_conversion

  peak_time_waiting_notice:
    action_type: operational
    title: "피크타임 대기 안내 개선"
    description: "피크타임 대기 시간을 SNS·플레이스에 사전 안내하고, 사전 주문 또는 예약 방문을 유도합니다."
    why_this_action: "서비스 경험 개선을 통해 고객 이탈을 줄이고 재방문율을 높일 수 있습니다."
    expected_effect: "피크타임 고객 만족도 개선, 재방문율 증가"
    risk_note: "대기 시간을 정확히 예측하기 어려울 수 있습니다. 느슨한 기준으로 안내 권장."
    evidence_trigger:
      - revenue_drop
      - benchmark_or_conversion

  delivery_margin_guardrail:
    action_type: channel
    title: "배달 채널 마진 검토 및 보정"
    description: "배달앱 수수료, 할인 구성, 배달 전용 메뉴 마진을 재검토하고 손익 분기점을 확인합니다."
    why_this_action: "배달 비중이 높을 때 수수료 구조를 최적화하지 않으면 매출이 증가해도 수익성이 낮아질 수 있습니다."
    expected_effect: "배달 채널 수익성 개선, 불필요한 할인 제거"
    risk_note: "배달앱 노출 순위에 영향을 줄 수 있으므로 단계적으로 조정 권장."
    evidence_trigger:
      - revenue_drop
      - channel

  low_traffic_cost_check:
    action_type: cost_management
    title: "저객수 시간대 비용 점검"
    description: "매출이 낮은 시간대의 인건비, 재료비, 에너지 비용을 점검하고 운영 시간 조정 여부를 검토합니다."
    why_this_action: "유동인구 감소로 매출이 줄어드는 기간에 고정 비용 구조를 최적화하면 순이익을 보호할 수 있습니다."
    expected_effect: "저효율 시간대 비용 절감, 순이익 마진 개선"
    risk_note: "영업 시간 단축은 기존 고객의 접근성을 낮출 수 있습니다. 신중하게 검토 필요."
    evidence_trigger:
      - revenue_drop
      - demand

  holiday_hours_notice:
    action_type: communication
    title: "공휴일 영업 시간 사전 공지"
    description: "공휴일 전날 SNS·플레이스에 영업 여부와 시간을 명확히 공지합니다."
    why_this_action: "공휴일 전후 매출 변화를 관측할 때, 고객이 영업 여부를 몰라 방문을 포기하는 경우를 줄일 수 있습니다."
    expected_effect: "공휴일 방문 기대 고객 유지, 불필요한 이탈 방지"
    risk_note: "공지 내용이 실제 운영과 다르면 신뢰도가 떨어집니다."
    evidence_trigger:
      - revenue_drop
      - context

  weather_sensitive_promotion_plan:
    action_type: promotion
    title: "날씨 연동 판촉 계획 수립"
    description: "우천, 폭염 등 날씨 변화에 따라 자동으로 다른 판촉을 운영하는 계획을 사전에 수립합니다."
    why_this_action: "날씨 영향이 반복적으로 관측될 때, 사전에 날씨 유형별 대응 계획이 있으면 빠르게 실행할 수 있습니다."
    expected_effect: "날씨 변화 대응 속도 향상, 매출 방어 기회 포착"
    risk_note: "판촉 계획을 너무 복잡하게 만들면 실행하기 어렵습니다. 2-3개 시나리오로 단순화 권장."
    evidence_trigger:
      - revenue_drop
      - weather

  competitor_density_differentiation:
    action_type: menu_update
    title: "경쟁 밀도 대비 차별화 포인트 강화"
    description: "동종 업종 점포 증가 시, 우리 매장만의 차별화 요소(특산 메뉴, 공간, 서비스)를 발굴하고 홍보합니다."
    why_this_action: "경쟁 점포 수 증가와 매출 하락이 함께 관측될 때, 단순 가격 경쟁보다 차별화가 장기적으로 유리합니다."
    expected_effect: "브랜드 인지도 향상, 충성 고객 비율 증가"
    risk_note: "차별화 요소 발굴에 시간이 걸립니다. 단기 효과보다 중기 전략으로 접근 필요."
    evidence_trigger:
      - revenue_drop
      - competition

action_mapping:
  revenue_drop_demand_weather:
    triggers:
      - revenue_drop
      - demand
      - weather
    recommended_actions:
      - rainy_day_takeout_coupon
      - warm_menu_exposure
      - regular_customer_reactivation

  revenue_drop_demand:
    triggers:
      - revenue_drop
      - demand
    recommended_actions:
      - weekday_evening_set_menu
      - low_traffic_cost_check
      - regular_customer_reactivation

  revenue_drop_competition:
    triggers:
      - revenue_drop
      - competition
    recommended_actions:
      - representative_menu_repositioning
      - bundle_instead_of_price_cut
      - competitor_density_differentiation

  revenue_drop_context:
    triggers:
      - revenue_drop
      - context
    recommended_actions:
      - local_event_takeout_menu
      - quick_order_menu_for_event_days
      - storefront_menu_copy_update

  revenue_drop_benchmark:
    triggers:
      - revenue_drop
      - benchmark_or_conversion
    recommended_actions:
      - storefront_menu_copy_update
      - representative_menu_repositioning
      - review_response_priority
